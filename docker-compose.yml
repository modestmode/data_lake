services:
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z-cpuv1
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: abcd
      MINIO_ROOT_PASSWORD: abcd2345
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - trino-network

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: iceberg_metastore
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trino-network

  trino:
    image: trinodb/trino:477
    container_name: trino

    ports:
      - "8080:8080"

    volumes:
      - ./trino/catalog:/etc/trino/catalog

    depends_on:
      - postgres
      - minio

    networks:
      - trino-network

networks:
  trino-network:
    driver: bridge